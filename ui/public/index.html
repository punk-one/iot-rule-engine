<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#105239" />
    <meta
      name="description"
      content="IoT Rule Engine 控制台，统一管理规则资产、运行态监控、插件协同与系统配置。"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script id="resize-observer-prebundle-guard">
      (function () {
        var patterns = [
          'ResizeObserver loop',
          'ResizeObserver loop completed with undelivered notifications',
        ];

        var isIgnorable = function (value) {
          var message = String(value || '');
          return patterns.some(function (pattern) {
            return message.indexOf(pattern) !== -1;
          });
        };

        var stopEvent = function (event) {
          if (!event) {
            return;
          }

          if (typeof event.preventDefault === 'function') {
            event.preventDefault();
          }
          if (typeof event.stopPropagation === 'function') {
            event.stopPropagation();
          }
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        };

        // Install before CRA injects webpackHotDevClient so the runtime overlay
        // never sees this browser-level ResizeObserver noise in development.
        window.addEventListener('error', function (event) {
          var message = event && (event.message || (event.error && event.error.message));
          if (!isIgnorable(message)) {
            return;
          }
          stopEvent(event);
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var message = reason && reason.message ? reason.message : reason;
          if (!isIgnorable(message)) {
            return;
          }
          stopEvent(event);
        }, true);
      })();
    </script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>IoT Rule Engine</title>
  </head>
